<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skrill Business Inc.</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #0a2540; --secondary: #00b4d8; --accent: #f0a500;
            --success: #2ecc71; --danger: #e74c3c; --light: #f4f7fa;
            --dark: #0a2540; --gray: #6b7280; --white: #fff; --border: #e5e7eb;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--light); color: var(--dark); line-height: 1.6; }
        .navbar { background: var(--primary); padding: 16px 40px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 20px rgba(0,0,0,0.3); }
        .navbar .logo { color: white; font-size: 1.5rem; font-weight: 800; }
        .navbar .logo span { color: var(--secondary); }
        .nav-links { display: flex; gap: 28px; align-items: center; }
        .nav-links a { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 0.95rem; transition: color 0.2s; }
        .nav-links a:hover { color: var(--secondary); }
        .btn { padding: 10px 24px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; border: none; transition: all 0.2s; display: inline-block; text-decoration: none; text-align: center; }
        .btn-primary { background: var(--secondary); color: white; }
        .btn-primary:hover { background: #0096c7; transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 2px solid var(--secondary); color: var(--secondary); }
        .btn-outline:hover { background: var(--secondary); color: white; }
        .btn-accent { background: var(--accent); color: var(--dark); }
        .btn-accent:hover { background: #d4920a; }
        .hero { background: linear-gradient(135deg, var(--primary) 0%, #1a3a5c 100%); padding: 100px 40px; text-align: center; color: white; position: relative; overflow: hidden; }
        .hero::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(0,180,216,0.1) 0%, transparent 60%); animation: pulse 4s ease-in-out infinite; }
        @keyframes pulse { 0%,100%{transform:scale(1);opacity:0.5} 50%{transform:scale(1.1);opacity:1} }
        .hero h1 { font-size: 3.5rem; font-weight: 900; margin-bottom: 20px; position: relative; z-index: 1; }
        .hero h1 span { color: var(--secondary); }
        .hero p { font-size: 1.3rem; opacity: 0.9; max-width: 600px; margin: 0 auto 40px; position: relative; z-index: 1; }
        .hero-btns { display: flex; gap: 16px; justify-content: center; position: relative; z-index: 1; }
        .hero-btns .btn { padding: 16px 40px; font-size: 1.1rem; }
        .section { padding: 80px 40px; max-width: 1200px; margin: 0 auto; }
        .section-title { text-align: center; font-size: 2.5rem; font-weight: 800; margin-bottom: 16px; }
        .section-sub { text-align: center; color: var(--gray); font-size: 1.1rem; margin-bottom: 50px; max-width: 600px; margin-left: auto; margin-right: auto; }
        .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .feature-card { background: white; padding: 36px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); transition: transform 0.3s, box-shadow 0.3s; }
        .feature-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.1); }
        .feature-card .icon { width: 56px; height: 56px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin-bottom: 20px; }
        .feature-card h3 { font-size: 1.2rem; margin-bottom: 10px; }
        .feature-card p { color: var(--gray); font-size: 0.95rem; }
        .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .pricing-card { background: white; border-radius: 16px; padding: 40px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.06); position: relative; overflow: hidden; }
        .pricing-card.popular { border: 3px solid var(--secondary); transform: scale(1.05); }
        .pricing-card.popular::before { content: 'MOST POPULAR'; position: absolute; top: 16px; right: -30px; background: var(--accent); color: var(--dark); font-size: 0.7rem; font-weight: 800; padding: 4px 40px; transform: rotate(45deg); }
